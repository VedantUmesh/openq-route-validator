name: Bug report
description: Report a reproducible defect in routing, validation, or the CLI.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: >-
        Please do not include secrets or vulnerability details. Use the private
        process in SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small Python or CLI example and its output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.12.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, installation method, and any relevant topology details.
