[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openq-route-validator"
version = "0.2.0"
description = "Deterministic, explainable route planning for finite directed bit-state networks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "OpenQ Route Validator contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
openq-route = "openq_route_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["UP006", "UP035", "UP037", "UP045"]
